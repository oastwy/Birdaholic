name: bird_flashcard
description: 鸟鸣闪卡学习工具
publish_to: none
version: 1.7.9+95
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  # v9 retains Android API 21 support while storing credentials in
  # EncryptedSharedPreferences; v10 raises the plugin minSdk to 23.
  flutter_secure_storage: ^9.2.4
  archive: ^4.0.0
  crypto: ^3.0.7
  file_picker: ^11.0.0
  http: ^1.2.0
  geolocator: ^13.0.4
  url_launcher: ^6.3.0
  wakelock_plus: ^1.4.0
  lpinyin: ^2.0.3
  # 本地打卡提醒（仅 Android 启用，代码内 Platform.isAndroid 守卫）。
  # ⚠️ 这三个无鸿蒙(ohos)实现：打鸿蒙包若 pub get/构建报错，临时注释掉本段再打。
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # 应用内更新一键装 APK（仅 Android，代码内 Platform.isAndroid 守卫，同 kacui 的方案）。
  # dio 是纯 Dart 无平台实现应该没事；open_filex 有原生插件、无鸿蒙 fork：
  # ⚠️ 打鸿蒙包若 pub get/构建报错，临时注释掉 open_filex 这行再打。
  dio: ^5.10.0
  open_filex: ^4.7.0

  # ── 鸿蒙(OpenHarmony)平台实现：仅 ohos 构建用，在其他平台惰性、不激活。
  #    路径指向本地 clone（~/ohos-flutter_packages），勿提交进发布分支。
  shared_preferences_ohos:
    path: /Users/wuyang/ohos-flutter_packages/packages/shared_preferences/shared_preferences_ohos
  path_provider_ohos:
    path: /Users/wuyang/ohos-flutter_packages/packages/path_provider/path_provider_ohos
  url_launcher_ohos:
    path: /Users/wuyang/ohos-flutter_packages/packages/url_launcher/url_launcher_ohos
  wakelock_plus_ohos: ^0.0.3
  # geolocator 鸿蒙实现：pub 的 0.0.3 有空安全 bug（timestamp 传 null），本地打补丁后用 path 挂。勿提交进发布分支。
  geolocator_ohos:
    path: /Users/wuyang/ohos-geolocator

# ── 鸿蒙(ohos)构建专用覆盖：audioplayers 全子包指向本地 6.1.0-ohos fork
#    （fork 内部 git URL 写坏了，必须全部 path 覆盖绕开）。
# ⚠️ 安卓打包要注释掉这块（ohos fork 在普通安卓编不过）；iOS/鸿蒙保持开启。
#    用 scripts/build_*.sh 打包会自动切换下面 START/END 之间的块，勿手动改这两行标记。
# BUILD-SCRIPT-OVERRIDES-START
dependency_overrides:
  audioplayers:
    path: /Users/wuyang/ohos-flutter_audioplayers/packages/audioplayers
  audioplayers_android:
    path: /Users/wuyang/ohos-flutter_audioplayers/packages/audioplayers_android
  audioplayers_darwin:
    path: /Users/wuyang/ohos-flutter_audioplayers/packages/audioplayers_darwin
  audioplayers_linux:
    path: /Users/wuyang/ohos-flutter_audioplayers/packages/audioplayers_linux
  audioplayers_web:
    path: /Users/wuyang/ohos-flutter_audioplayers/packages/audioplayers_web
  audioplayers_windows:
    path: /Users/wuyang/ohos-flutter_audioplayers/packages/audioplayers_windows
  audioplayers_ohos:
    path: /Users/wuyang/ohos-flutter_audioplayers/packages/audioplayers_ohos
  audioplayers_platform_interface: ^7.0.0
  path_provider: ^2.1.0
# BUILD-SCRIPT-OVERRIDES-END

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/avilist_species.json
    - assets/data/ebird_sample_checklist.csv
    - assets/data/china_birds.json
    - assets/data/china_birds_zheng.json
    - assets/data/china_quiz_bank.json
    - assets/data/china_common_100.json
    - assets/data/world_birds.json
    - assets/data/taxonomy_synonyms.json
    - assets/data/region_names_zh.json
    - assets/data/provinces/
    - assets/brand/birdaholic_logo.png
    - assets/brand/wechat_group_qr_20260614.jpg
    - assets/sounds/complete.m4a
    - data_packs/china_common_100_v2.0_opt.zip
