<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发现页运营后台 · Birdaholic</title>
<style>
  :root { --green:#2d5016; --line:#e3e3e3; --muted:#888; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin:0; background:#f5f6f3; color:#222; }
  header { background:var(--green); color:#fff; padding:14px 16px; font-size:17px; font-weight:700;
           position:sticky; top:0; z-index:10; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, textarea, select { width:100%; padding:8px 10px; border:1px solid var(--line);
           border-radius:8px; font-size:14px; font-family:inherit; }
  textarea { min-height:54px; resize:vertical; }
  button { border:none; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; }
  .primary { background:var(--green); color:#fff; }
  .ghost { background:#eee; color:#333; }
  .danger { background:#fff; color:#c0392b; border:1px solid #e6b0aa; }
  .row { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#fafafa; }
  .row .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .toprow { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .toprow > div { flex:1; min-width:180px; }
  .status-active { color:var(--green); font-weight:700; }
  .status-expired { color:#c0392b; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  #qrPreview { max-width:140px; border:1px solid var(--line); border-radius:8px; margin-top:8px; display:block; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#333; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
           opacity:0; transition:opacity .2s; pointer-events:none; z-index:99; }
  .toast.show { opacity:1; }
  .sechead { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
</style>
</head>
<body>
<header>发现页运营后台 · Birdaholic</header>
<main>
  <div class="card">
    <div class="toprow">
      <div>
        <label>管理员 Token</label>
        <input id="token" type="password" placeholder="admin token" autocomplete="off">
      </div>
      <button class="ghost" onclick="loadAll()">加载现有内容</button>
      <button class="primary" onclick="saveAll()">保存全部</button>
    </div>
    <div class="hint">先填 Token 再点「加载」。改完点「保存全部」立即生效（App 端 1 小时缓存，可重启 App 立即看到）。</div>
  </div>

  <div class="card">
    <h2>入群二维码</h2>
    <input id="qrFile" type="file" accept="image/*">
    <button class="primary" style="margin-top:8px" onclick="uploadQr()">上传新二维码</button>
    <div class="hint">上传后自动压缩并立即生效，无需再点「保存全部」。</div>
    <img id="qrPreview" alt="（当前二维码）" style="display:none">
  </div>

  <div class="card">
    <div class="sechead"><h2>志愿招募</h2><button class="ghost" onclick="addVol()">+ 新增</button></div>
    <div id="vols"></div>
  </div>

  <div class="card">
    <div class="sechead"><h2>观鸟资讯（鸟讯 / 鸟导 / 鸟团 / 出行 / 鸟种攻略）</h2><button class="ghost" onclick="addNews()">+ 新增</button></div>
    <div id="news"></div>
  </div>
</main>
<div id="toast" class="toast"></div>

<script>
const API = location.origin;
let state = { groupQr:{imageUrl:"",updatedAt:""}, volunteers:[], news:[] };

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function tok(){ return document.getElementById('token').value.trim(); }
function esc(s){ return (s||'').replace(/"/g,'&quot;'); }

function statusSelect(val){
  const a = val==='expired' ? '' : 'selected';
  const e = val==='expired' ? 'selected' : '';
  return `<select data-f="status"><option value="active" ${a}>✅ 有效</option><option value="expired" ${e}>⛔ 过期</option></select>`;
}

function volRow(v){
  return `<div class="row" data-kind="vol">
    <label>标题</label><input data-f="title" value="${esc(v.title)}">
    <div class="grid">
      <div><label>机构/来源</label><input data-f="org" value="${esc(v.org)}"></div>
      <div><label>时间标签（如 2026春迁）</label><input data-f="date" value="${esc(v.date)}"></div>
    </div>
    <label>链接 URL</label><input data-f="url" value="${esc(v.url)}">
    <div class="grid" style="margin-top:8px">
      <div><label>状态</label>${statusSelect(v.status)}</div>
      <div style="display:flex;align-items:flex-end;justify-content:flex-end"><button class="danger" onclick="this.closest('.row').remove()">删除</button></div>
    </div>
    <input type="hidden" data-f="id" value="${esc(v.id)}">
  </div>`;
}

function newsRow(n){
  return `<div class="row" data-kind="news">
    <label>标题</label><input data-f="title" value="${esc(n.title)}">
    <label>摘要</label><textarea data-f="summary">${(n.summary||'')}</textarea>
    <div class="grid">
      <div><label>分类（鸟讯/鸟导/鸟团/出行/鸟种攻略）</label><input data-f="category" value="${esc(n.category)}"></div>
      <div><label>时间标签</label><input data-f="date" value="${esc(n.date)}"></div>
    </div>
    <label>链接 URL（可空）</label><input data-f="url" value="${esc(n.url)}">
    <div class="grid" style="margin-top:8px">
      <div><label>状态</label>${statusSelect(n.status)}</div>
      <div style="display:flex;align-items:flex-end;justify-content:flex-end"><button class="danger" onclick="this.closest('.row').remove()">删除</button></div>
    </div>
    <input type="hidden" data-f="id" value="${esc(n.id)}">
  </div>`;
}

function render(){
  document.getElementById('vols').innerHTML = state.volunteers.map(volRow).join('');
  document.getElementById('news').innerHTML = state.news.map(newsRow).join('');
  const img = document.getElementById('qrPreview');
  if(state.groupQr && state.groupQr.imageUrl){ img.src = state.groupQr.imageUrl + '?t=' + Date.now(); img.style.display='block'; }
  else img.style.display='none';
}

function addVol(){ document.getElementById('vols').insertAdjacentHTML('beforeend', volRow({status:'active'})); }
function addNews(){ document.getElementById('news').insertAdjacentHTML('beforeend', newsRow({status:'active'})); }

function collect(containerId){
  const out=[];
  document.querySelectorAll('#'+containerId+' .row').forEach(row=>{
    const o={};
    row.querySelectorAll('[data-f]').forEach(el=> o[el.getAttribute('data-f')] = el.value);
    if((o.title||'').trim()) out.push(o);
  });
  return out;
}

async function loadAll(){
  try{
    const r = await fetch(API + '/api/discover');
    const d = await r.json();
    state = Object.assign({groupQr:{imageUrl:"",updatedAt:""}, volunteers:[], news:[]}, d);
    render();
    toast('已加载');
  }catch(e){ toast('加载失败: ' + e); }
}

async function saveAll(){
  if(!tok()){ toast('请先填 Token'); return; }
  const payload = { groupQr: state.groupQr, volunteers: collect('vols'), news: collect('news') };
  try{
    const r = await fetch(API + '/api/discover', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok()},
      body: JSON.stringify(payload)
    });
    if(!r.ok){ toast('保存失败: ' + r.status + ' ' + (await r.text())); return; }
    toast('已保存 ✓'); loadAll();
  }catch(e){ toast('保存出错: ' + e); }
}

async function uploadQr(){
  if(!tok()){ toast('请先填 Token'); return; }
  const f = document.getElementById('qrFile').files[0];
  if(!f){ toast('请先选图片'); return; }
  const fd = new FormData(); fd.append('file', f); fd.append('token', tok());
  try{
    const r = await fetch(API + '/api/discover/qr', {
      method:'POST', headers:{'Authorization':'Bearer '+tok()}, body: fd
    });
    const d = await r.json();
    if(!r.ok || !d.ok){ toast('上传失败: ' + (d.detail||r.status)); return; }
    state.groupQr = {imageUrl:d.imageUrl, updatedAt:String(Date.now())};
    render(); toast('二维码已更新 ✓');
  }catch(e){ toast('上传出错: ' + e); }
}

// 打开页面即自动拉取现有内容（GET 公开，无需 Token），免得看到空白
window.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
</html>
